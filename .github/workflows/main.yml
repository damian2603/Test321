name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply GTNH formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Show formatting diff
        run: git diff -- src/main/java

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: connectivitygtnh-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
